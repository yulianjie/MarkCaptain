[package]
name = "markcaptain"
version = "0.8.1"
description = "MarkCaptain — an intelligent, local-first Markdown editor with a writing Agent"
authors = ["Lianjie Yu and MarkCaptain contributors"]
license = "MIT"
repository = "https://github.com/yulianjie/MarkCaptain"
edition = "2021"
rust-version = "1.77"

# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "markcaptain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-cli = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Filesystem
notify = "7"
notify-debouncer-full = "0.4"
walkdir = "2"
dirs = "5"
trash = "5"

# Encoding detection (replaces `ced` native addon)
chardetng = "0.1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"

# Markdown server-side parsing (for export & spec tests; Muya still parses in webview)
pulldown-cmark = "0.12"

# HTTP (image upload, Unsplash, GitHub)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
futures-util = "0.3"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust", "vendored"] }

# Schema validation for preferences
jsonschema = { version = "0.28", default-features = false }

# Search (ripgrep library)
grep = "0.3"
ignore = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc
once_cell = "1"
parking_lot = "0.12"

# Spellcheck (pure-Rust Hunspell-compatible engine)
spellbook = "0.3"
url = "2"
percent-encoding = "2"
quick-xml = "0.37"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
raw-window-handle = "0.6"
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 0
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
