name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build / publish (e.g. v0.1.0)'
        required: true
      macos_only:
        description: 'Rebuild only the two macOS architectures'
        type: boolean
        default: false

# Needed to create the release and upload assets
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 macOS is cross-compiled on the Apple Silicon runner.
        # Manual macOS retries preserve already-published Windows/Linux assets.
        platform: >-
          ${{ fromJSON(github.event.inputs.macos_only == 'true' &&
          '[{"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},{"name":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin"}]' ||
          '[{"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},{"name":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin"},{"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Manual retries must build the requested release, not current master.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build deps
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci || npm install

      # ---- Windows / Linux: build every default bundle (msi+nsis / deb+rpm+appimage) ----
      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.platform.target }}

      # ---- macOS: build .app + .dmg, but treat .dmg as best-effort ----
      # The GitHub macOS runner image (Provisioner 2025xxxx) removed Finder, which
      # breaks bundle_dmg.sh's AppleScript window-styling step. The .app is built
      # fine; Tauri's signed updater archive is the guaranteed download.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Apple code-signing / notarization (same vars clash-verge-rev uses).
          # Tauri reads these automatically; unset empty optional Apple values below.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty optional secrets still count as configured environment variables
          # to Tauri. In particular, APPLE_CERTIFICATE="" triggers an invalid
          # keychain import instead of the intended unsigned build.
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              unset "$key"
            fi
          done

          # A successful .app build (including any configured signing) is required.
          # Only the subsequent DMG packaging step is allowed to fail.
          npm run tauri:build -- --target ${{ matrix.platform.target }} --bundles app

          set +e
          # Retain the .app for the tarball: selecting only dmg removes it.
          npm run tauri:build -- --target ${{ matrix.platform.target }} --bundles app dmg
          code=$?
          set -e

          base="src-tauri/target/${{ matrix.platform.target }}/release/bundle"
          app=$(ls -d "$base/macos/"*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::error::macOS .app bundle was not produced — real build failure"
            exit 1
          fi

          if [ $code -ne 0 ]; then
            echo "::warning::DMG packaging failed after a successful .app build; shipping .app tarball only"
            rm -rf "$base/dmg"
          fi

          # Keep Tauri's signed .app.tar.gz byte-for-byte; repacking breaks its signature.

      - name: Stage signed updater artifact
        shell: bash
        run: |
          case "${{ matrix.platform.target }}" in
            aarch64-apple-darwin) platform=darwin-aarch64 ;;
            x86_64-apple-darwin) platform=darwin-x86_64 ;;
            x86_64-unknown-linux-gnu) platform=linux-x86_64 ;;
            x86_64-pc-windows-msvc) platform=windows-x86_64 ;;
            *) exit 1 ;;
          esac
          node scripts/updater-release.mjs stage "src-tauri/target/${{ matrix.platform.target }}/release/bundle" "updater-assets" "$RELEASE_TAG" "$platform"

      # ---- Upload all produced bundles to the GitHub Release ----
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'MarkCaptain ${{ env.RELEASE_TAG }}'
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            updater-assets/*
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/rpm/*.rpm

  updater-manifest:
    name: Publish complete updater manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate manifest from all four signed release platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/updater-release.mjs manifest "$RELEASE_TAG" updater-manifest
      - name: Publish manifest after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" updater-manifest/latest.json --repo yulianjie/MarkCaptain --clobber
