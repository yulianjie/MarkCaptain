name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build / publish (e.g. v0.1.0)'
        required: true

# Needed to create the release and upload assets
permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Both macOS arches build on macos-latest (plentiful Apple Silicon runners).
          # x86_64 is cross-compiled here — the dedicated macos-13 Intel runners are
          # scarce and queue for a long time. No openssl: reqwest uses rustls-tls.
          - { name: 'macos-arm64', os: 'macos-latest',   target: 'aarch64-apple-darwin'   }
          - { name: 'macos-x64',   os: 'macos-latest',   target: 'x86_64-apple-darwin'    }
          - { name: 'linux-x64',   os: 'ubuntu-22.04',   target: 'x86_64-unknown-linux-gnu' }
          - { name: 'windows-x64', os: 'windows-latest', target: 'x86_64-pc-windows-msvc'  }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci || npm install

      # ---- Windows / Linux: build every default bundle (msi+nsis / deb+rpm+appimage) ----
      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: npm run tauri:build -- --target ${{ matrix.platform.target }}

      # ---- macOS: build .app + .dmg, but treat .dmg as best-effort ----
      # The GitHub macOS runner image (Provisioner 2025xxxx) removed Finder, which
      # breaks bundle_dmg.sh's AppleScript window-styling step. The .app is built
      # fine; we tar it as a guaranteed download and keep the .dmg if it succeeds.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Optional Apple code-signing / notarization (same vars clash-verge-rev uses).
          # tauri reads these automatically; leaving them empty produces an unsigned build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          npm run tauri:build -- --target ${{ matrix.platform.target }} --bundles app dmg
          code=$?
          set -e

          base="src-tauri/target/${{ matrix.platform.target }}/release/bundle"
          app=$(ls -d "$base/macos/"*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::error::macOS .app bundle was not produced — real build failure"
            exit 1
          fi

          if [ $code -ne 0 ]; then
            echo "::warning::DMG bundling failed (known macOS runner Finder regression); shipping .app tarball only"
            rm -rf "$base/dmg"
          fi

          # Always ship a tarball of the .app as a reliable, Finder-free artifact.
          tar -czf "$base/macos/MarkCaptain_${RELEASE_TAG}_${{ matrix.platform.name }}.app.tar.gz" \
            -C "$base/macos" "$(basename "$app")"

      # ---- Upload all produced bundles to the GitHub Release ----
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 'MarkCaptain ${{ env.RELEASE_TAG }}'
          body: 'See the assets below to download and install MarkCaptain for your platform.'
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/rpm/*.rpm
